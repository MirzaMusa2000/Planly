# Planly Apache tweaks
ServerTokens Prod
ServerSignature Off
ServerName localhost

<Directory ${APACHE_DOCUMENT_ROOT}>
    AllowOverride All
    Require all granted
</Directory>

# Keep memory within small instances (e.g. Render free: 512 MB). Each PHP
# worker uses roughly 30–60 MB; a friends-sized app needs only a few.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       6
    MaxConnectionsPerChild  500
</IfModule>

# Long-lived caching for fingerprinted Vite assets.
<LocationMatch "^/build/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Logs to stdout/stderr for Cloud Logging.
ErrorLog /dev/stderr
CustomLog /dev/stdout combined
