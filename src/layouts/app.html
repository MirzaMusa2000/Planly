<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <include src="partials/head.html" title="{{ title }}"></include>
</head>
<!-- data-access: who may see this page (checked in js/session.js before Alpine starts) -->
<body class="h-full font-sans text-slate-800 antialiased" data-access="{{ access }}" data-page="{{ page }}">
    <include src="partials/boot-splash.html"></include>

    <!-- Desktop sidebar -->
    <aside x-data class="fixed inset-y-0 left-0 z-40 hidden w-64 flex-col bg-ink-950 px-4 py-6 lg:flex">
        <a href="/" class="flex items-center gap-2.5 px-2">
            <include src="partials/logo.html" size="h-9 w-9" id="sidebar"></include>
            <span class="text-xl font-bold tracking-tight text-white">Planly</span>
        </a>

        <button type="button" @click="$store.session.propose()" class="btn btn-primary mt-8 w-full py-3">
            <x-icon name="plus" class="h-4 w-4"/> Propose event
        </button>

        <nav class="mt-6 space-y-1" aria-label="Main">
            <a href="/" class="nav-link" :class="{ 'nav-link-active': $store.session.page === 'home' }"
               :aria-current="$store.session.page === 'home' ? 'page' : null">
                <x-icon name="home"/> Home
            </a>
            <a href="/members" x-show="$store.session.isAdmin" x-cloak class="nav-link"
               :class="{ 'nav-link-active': $store.session.page === 'members' }"
               :aria-current="$store.session.page === 'members' ? 'page' : null">
                <x-icon name="users"/> Members
            </a>
        </nav>

        <div class="mt-auto flex items-center gap-3 rounded-2xl bg-ink-900 p-3">
            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-gradient-to-br from-brand-300 to-brand-600 text-sm font-bold text-white"
                  aria-hidden="true" x-text="$store.session.initial"></span>
            <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-semibold text-white" x-text="$store.session.user?.displayName"></p>
                <p class="truncate text-xs text-slate-400" x-text="$store.session.isAdmin ? 'Admin' : 'Member'"></p>
            </div>
            <button type="button" @click="$store.session.logout()" title="Sign out"
                    class="grid h-9 w-9 place-items-center rounded-xl text-slate-400 hover:bg-white/5 hover:text-white">
                <x-icon name="logout" class="h-[18px] w-[18px]"/>
                <span class="sr-only">Sign out</span>
            </button>
        </div>
    </aside>

    <div class="flex min-h-full flex-col lg:pl-64">
        <!-- Mobile header -->
        <header x-data class="sticky top-0 z-30 flex h-14 items-center gap-2.5 bg-canvas/80 px-4 backdrop-blur lg:hidden">
            <include src="partials/logo.html" size="h-8 w-8" id="header"></include>
            <span class="text-lg font-bold tracking-tight text-slate-900">Planly</span>
            <span class="ml-auto grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand-300 to-brand-600 text-sm font-bold text-white"
                  aria-hidden="true" x-text="$store.session.initial"></span>
        </header>

        <main class="mx-auto w-full max-w-6xl flex-1 px-4 pt-2 pb-28 sm:px-6 lg:px-8 lg:pt-8 lg:pb-10">
            <!-- content -->
        </main>
    </div>

    <!-- Mobile bottom tab bar -->
    <nav x-data class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200/70 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur lg:hidden" aria-label="Main">
        <div class="mx-auto flex h-16 max-w-md items-stretch px-2">
            <div class="flex flex-1 items-stretch justify-around">
                <a href="/" class="flex flex-1 flex-col items-center justify-center gap-1 text-[11px] font-semibold"
                   :class="$store.session.page === 'home' ? 'text-brand-600' : 'text-slate-400'">
                    <x-icon name="home" class="h-[22px] w-[22px]"/> Home
                </a>
                <a href="/members" x-show="$store.session.isAdmin" x-cloak
                   class="flex flex-1 flex-col items-center justify-center gap-1 text-[11px] font-semibold"
                   :class="$store.session.page === 'members' ? 'text-brand-600' : 'text-slate-400'">
                    <x-icon name="users" class="h-[22px] w-[22px]"/> Members
                </a>
            </div>

            <!-- Centre "+" -->
            <div class="flex w-20 items-start justify-center">
                <button type="button" @click="$store.session.propose()"
                        class="-mt-5 grid h-14 w-14 place-items-center rounded-full bg-brand-500 text-white shadow-lift ring-4 ring-white transition hover:bg-brand-600">
                    <x-icon name="plus" class="h-6 w-6"/>
                    <span class="sr-only">Propose event</span>
                </button>
            </div>

            <div class="flex flex-1 items-stretch justify-around">
                <button type="button" @click="$store.session.logout()" class="flex flex-1 flex-col items-center justify-center gap-1 text-[11px] font-semibold text-slate-400">
                    <x-icon name="logout" class="h-[22px] w-[22px]"/>
                    Sign out
                </button>
            </div>
        </div>
    </nav>

    <!-- Offline banner -->
    <div x-data="{ online: navigator.onLine }" @online.window="online = true" @offline.window="online = false"
         x-show="!online" x-cloak role="status"
         class="fixed inset-x-0 top-0 z-[80] bg-amber-500 px-4 py-1.5 text-center text-sm font-semibold text-white shadow">
        You’re offline. Live updates are paused and some actions won’t work until you reconnect.
    </div>

    <include src="partials/toasts.html"></include>
    <include src="partials/chat.html"></include>
</body>
</html>
