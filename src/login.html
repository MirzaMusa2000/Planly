<!-- layout: guest | title: Sign in | page: login | access: guest -->
    <div class="card overflow-hidden">
        <div class="relative h-44">
            <include src="partials/hero-art.html" class="absolute inset-0 h-full w-full"></include>
            <div class="relative flex h-full flex-col justify-between p-6 text-white">
                <div class="flex items-center gap-2.5">
                    <include src="partials/logo.html" size="h-8 w-8" id="guest"></include>
                    <span class="brand text-lg font-bold tracking-tight">Planly</span>
                </div>
                <div>
                    <p class="text-sm font-medium text-white/80" data-t>Plans with friends, sorted</p>
                    <h1 class="text-2xl font-bold tracking-tight"><span data-t>Find the day</span><br><span data-t>everyone’s free</span></h1>
                </div>
            </div>
        </div>

        <div class="p-6 sm:p-8">
    <div x-data="loginForm">
        <p x-show="notice" x-text="notice" x-cloak role="alert"
           class="mb-5 rounded-2xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-800"></p>
        <!-- Sign in / Create account switch -->
        <div class="grid grid-cols-2 rounded-2xl bg-slate-100 p-1 text-sm font-semibold" role="tablist">
            <button type="button" role="tab" :aria-selected="!isSignup" @click="isSignup && toggleMode()"
                    :class="!isSignup ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'"
                    class="rounded-xl py-2 transition" data-t>Sign in</button>
            <button type="button" role="tab" :aria-selected="isSignup" @click="!isSignup && toggleMode()"
                    :class="isSignup ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'"
                    class="rounded-xl py-2 text-slate-500 transition" data-t>Create account</button>
        </div>

        <p class="mt-4 text-sm text-slate-500"
           x-text="isSignup ? $t('An admin approves new accounts before you can join in.') : $t('Welcome back! Sign in to see what’s planned.')">
            Welcome back! Sign in to see what’s planned.
        </p>

        <form class="mt-5 space-y-4" @submit.prevent="submit" novalidate>
            <div x-show="isSignup" x-cloak>
                <label for="displayName" class="label" data-t>Your name</label>
                <div class="relative">
                    <x-icon name="user" class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-400"/>
                    <input data-t-attr="placeholder" id="displayName" type="text" x-model="displayName" maxlength="60" autocomplete="name"
                           placeholder="What should friends call you?" :required="isSignup" class="input pl-11">
                </div>
            </div>

            <div>
                <label for="email" class="label" data-t>Email</label>
                <div class="relative">
                    <x-icon name="mail" class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-400"/>
                    <input id="email" type="email" x-model="email" required autocomplete="email" inputmode="email"
                           placeholder="you@example.com" class="input pl-11">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="label" data-t>Password</label>
                    <button type="button" x-show="!isSignup" @click="resetPassword"
                            class="mb-1.5 text-xs font-semibold text-brand-600 hover:text-brand-500" data-t>Forgot password?</button>
                </div>
                <div class="relative">
                    <x-icon name="lock" class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-400"/>
                    <input id="password" type="password" x-model="password" required minlength="6"
                           :autocomplete="isSignup ? 'new-password' : 'current-password'"
                           :placeholder="isSignup ? $t('At least 6 characters') : '••••••••'" class="input pl-11">
                </div>
            </div>

            <label class="flex cursor-pointer items-start gap-3 select-none">
                <input type="checkbox" x-model="remember"
                       class="mt-0.5 h-[18px] w-[18px] shrink-0 cursor-pointer rounded accent-brand-600">
                <span class="text-sm">
                    <span class="font-semibold text-slate-700" data-t>Remember me</span>
                    <span class="block text-xs text-slate-500"
                          x-text="remember ? $t('Stay signed in on this device.') : $t('You’ll be signed out when you close the browser.')"></span>
                </span>
            </label>

            <p x-show="error" x-text="error" x-cloak role="alert"
               class="rounded-2xl bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700"></p>
            <p x-show="info" x-text="info" x-cloak role="status"
               class="rounded-2xl bg-brand-50 px-4 py-3 text-sm font-medium text-brand-700"></p>

            <button type="submit" :disabled="busy" class="btn btn-primary w-full py-3">
                <svg x-show="busy" x-cloak class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                    <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <span x-text="isSignup ? $t('Create account') : $t('Sign in')">Sign in</span>
            </button>
        </form>
    </div>

        </div>
    </div>
