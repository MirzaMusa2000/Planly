<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>{{ title }} · Planly</title>
<!-- Theme before first paint (no white flash in dark mode); choice kept by js/ui.js.
     Also marks the staging site (.staging: the .brand name reads "Planly Staging"). -->
<script>
    (function () {
        try {
            var choice = localStorage.getItem('planly.theme') || 'system';
            var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
        // Staging preview channel (planly-794a5--staging-….web.app): "Planly Staging".
        if (/--staging-/.test(location.hostname)) {
            document.documentElement.classList.add('staging');
            document.title = document.title.replace(/Planly$/, 'Planly Staging');
        }
    })();
</script>
<!-- App icons: generated by `npm run icons` (scripts/generate-icons.mjs) -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Planly">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
