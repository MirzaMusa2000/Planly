<!-- The expense sheet of the shown event `e`: No / Item / Paid by / Amount / Each, like
     the group's "costing" spreadsheet. Lives inside expensesPage (js/expenses-page.js). -->
<section class="card p-5" aria-labelledby="expenses-title">
    <div class="flex items-center gap-2">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-emerald-50 text-emerald-600">
            <x-icon name="receipt" class="h-[18px] w-[18px]"/>
        </span>
        <h2 id="expenses-title" class="text-base font-bold text-slate-900" data-t>Expenses</h2>
    </div>

    <p x-show="loading" class="py-6 text-center text-sm text-slate-400" data-t>Loading…</p>
    <p x-show="!loading && !expenses.length && !(formOpen && !form.id)"
       class="mt-4 rounded-2xl border-2 border-dashed border-slate-200 px-4 py-5 text-center text-sm text-slate-400" data-t>
        No expenses yet. Add what’s been paid, like the glamping or the groceries.
    </p>

    <!-- Column headings (wider screens) -->
    <div x-show="rows.length" aria-hidden="true"
         class="mt-4 hidden grid-cols-[1.75rem_minmax(0,1fr)_6.5rem_6rem_5.5rem] gap-3 border-b border-slate-100 pb-2 text-[11px] font-bold tracking-wide text-slate-400 uppercase sm:grid">
        <span class="text-right" data-t>No</span>
        <span data-t>Item</span>
        <span data-t>Paid by</span>
        <span class="text-right" data-t>Amount</span>
        <span class="text-right" data-t>Each</span>
    </div>

    <ul class="divide-y divide-slate-100" :class="rows.length ? 'mt-3 sm:mt-0' : ''">
        <template x-for="row in rows" :key="row.id">
            <li>
                <!-- Read mode -->
                <button type="button" x-show="!isEditing(row.id)" @click="openEdit(row)" :disabled="!canEdit(row)"
                        :aria-label="canEdit(row) ? $t('Edit {item}', { item: row.item }) : row.item"
                        class="grid w-full grid-cols-[1.75rem_minmax(0,1fr)_auto] items-center gap-3 rounded-xl py-2.5 text-left transition enabled:hover:bg-slate-50 disabled:cursor-default sm:grid-cols-[1.75rem_minmax(0,1fr)_6.5rem_6rem_5.5rem]">
                    <span class="text-right text-xs font-semibold text-slate-400" x-text="row.no"></span>

                    <span class="min-w-0">
                        <span class="block font-semibold break-words text-slate-900" x-text="row.item"></span>
                        <!-- Payer and share under the item on phones -->
                        <span class="block text-xs text-slate-500 sm:hidden"
                              x-text="$t('Paid by {name} · {amount} each', { name: memberName(row.paidBy), amount: formatRM(row.eachCents) })"></span>
                        <span class="block text-xs text-slate-400" x-show="row.splitWith.length !== participants.size"
                              x-text="$t('Split: {names}', { names: splitLabel(row) })"></span>
                        <span x-show="row.notes" class="block text-xs break-words text-slate-400" x-text="row.notes"></span>
                    </span>

                    <span class="hidden min-w-0 sm:block">
                        <span class="chip max-w-full truncate"
                              :class="row.paidBy === me.uid ? 'bg-brand-100 text-brand-700' : 'bg-slate-100 text-slate-600'"
                              x-text="memberName(row.paidBy)"></span>
                    </span>
                    <span class="text-right font-semibold text-slate-900" x-text="formatRM(row.amountCents)"></span>
                    <span class="hidden text-right text-sm text-slate-500 sm:block" x-text="formatRM(row.eachCents)"></span>
                </button>

                <!-- Edit mode -->
                <template x-if="isEditing(row.id)">
                    <div class="py-2.5"><include src="partials/expense-form.html"></include></div>
                </template>
            </li>
        </template>
    </ul>

    <!-- Total overall -->
    <div x-show="rows.length"
         class="mt-1 grid grid-cols-[1.75rem_minmax(0,1fr)_auto] items-center gap-3 rounded-2xl bg-slate-50 py-3 pr-1 sm:grid-cols-[1.75rem_minmax(0,1fr)_6.5rem_6rem_5.5rem]">
        <span></span>
        <span class="text-sm font-bold text-slate-900" data-t>Total overall</span>
        <span class="hidden sm:block"></span>
        <span class="text-right font-bold text-slate-900" x-text="formatRM(totalCents)"></span>
        <span class="hidden text-right text-sm font-semibold text-slate-600 sm:block" x-text="formatRM(eachCents)"
              :title="evenSplit ? $t('Each person') : $t('Average per person (some items are split differently)')"></span>
    </div>

    <!-- Add -->
    <div class="mt-3">
        <template x-if="formOpen && !form.id">
            <include src="partials/expense-form.html"></include>
        </template>
        <button type="button" x-show="!(formOpen && !form.id)" @click="openAdd()"
                class="flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-200 py-2.5 text-sm font-semibold text-slate-500 transition hover:border-emerald-300 hover:text-emerald-600">
            <x-icon name="plus" class="h-4 w-4"/> <span data-t>Add expense</span>
        </button>
    </div>
</section>
