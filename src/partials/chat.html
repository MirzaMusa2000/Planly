<!-- Group chat: floating button + slide-up panel (full screen on mobile).  -->
<div x-data="chat" @keydown.escape.window="open && !$store.overlays.dialog && close()">
    <!-- Floating button (sits above the mobile tab bar)  -->
    <button type="button" @click="toggle()"
            :aria-expanded="open" aria-controls="chat-panel"
            :aria-label="open ? 'Close chat' : (unreadCount ? `Open chat, ${unreadLabel} unread` : 'Open chat')"
            :class="open ? 'max-sm:hidden' : ''"
            class="fixed right-4 bottom-24 z-[45] grid h-14 w-14 place-items-center rounded-full bg-ink-900 text-white shadow-lift ring-4 ring-white/70 transition hover:bg-ink-800 lg:right-6 lg:bottom-6">
        <x-icon name="chat" class="h-6 w-6" x-show="!open"/>
        <x-icon name="x" class="h-6 w-6" x-show="open" x-cloak/>
        <span x-show="unreadCount > 0 && !open" x-cloak x-text="unreadLabel"
              class="absolute -top-1 -right-1 grid h-6 min-w-6 place-items-center rounded-full bg-rose-500 px-1.5 text-xs font-bold text-white ring-2 ring-white"></span>
    </button>

    <!-- Panel  -->
    <section id="chat-panel" x-show="open" x-cloak role="dialog" aria-label="Group chat"
             x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-6 opacity-0"
             x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="translate-y-6 opacity-0"
             class="fixed inset-0 z-[65] flex flex-col bg-canvas sm:inset-auto sm:right-4 sm:bottom-40 sm:h-[36rem] sm:max-h-[calc(100dvh-12rem)] sm:w-[24rem] sm:overflow-hidden sm:rounded-3xl sm:shadow-2xl lg:right-6 lg:bottom-24 lg:max-h-[calc(100dvh-8rem)]">

        <!-- Header  -->
        <header class="relative flex items-center gap-3 overflow-hidden bg-ink-900 px-4 pt-[max(0.875rem,env(safe-area-inset-top))] pb-3.5 text-white">
            <div class="grid h-10 w-10 place-items-center rounded-2xl bg-white/10">
                <x-icon name="chat" class="h-5 w-5"/>
            </div>
            <div class="min-w-0 flex-1">
                <h2 class="font-bold">Group chat</h2>
                <p class="text-xs text-slate-400" x-text="$store.planner.approvedCount ? $store.planner.approvedCount + ' members' : 'Everyone in Planly'"></p>
            </div>
            <button type="button" @click="close()" class="grid h-9 w-9 place-items-center rounded-xl text-slate-300 hover:bg-white/10" aria-label="Close chat">
                <x-icon name="x"/>
            </button>
        </header>

        <!-- Messages  -->
        <div x-ref="scroller" class="flex-1 overflow-y-auto px-3 py-4" aria-live="polite">
            <!-- x-if (not x-show): added/removed synchronously, even in a background tab.  -->
            <template x-if="hasMore">
                <div class="mb-3 text-center">
                    <button type="button" @click="loadOlder()" :disabled="loadingOlder"
                            class="rounded-full bg-white px-4 py-1.5 text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50 disabled:opacity-60"
                            x-text="loadingOlder ? 'Loading…' : 'Load older messages'"></button>
                </div>
            </template>
            <p x-show="ready && !hasMore && messages.length >= 50" class="mb-3 text-center text-[11px] text-slate-400">That’s the beginning of the chat.</p>

            <p x-show="!ready && !error" class="py-10 text-center text-sm text-slate-400">Loading chat…</p>

            <div x-show="ready && messages.length === 0" class="flex flex-col items-center py-12 text-center">
                <div class="grid h-14 w-14 place-items-center rounded-3xl bg-brand-50 text-2xl" aria-hidden="true">👋</div>
                <p class="mt-3 font-semibold text-slate-800">Say hi to the group</p>
                <p class="mt-1 text-sm text-slate-500">Messages are shared with every member.</p>
            </div>

            <ol class="space-y-0.5">
                <template x-for="(m, i) in messages" :key="m.id">
                    <li>
                        <!-- Day divider  -->
                        <div x-show="startsDay(i)" class="my-3 flex items-center gap-3 text-[11px] font-semibold text-slate-400">
                            <span class="h-px flex-1 bg-slate-200"></span>
                            <span x-text="dayLabel(m.createdAt)"></span>
                            <span class="h-px flex-1 bg-slate-200"></span>
                        </div>

                        <div class="flex items-end gap-2" :class="[isMine(m) ? 'justify-end' : 'justify-start', startsGroup(i) ? 'mt-3' : '']">
                            <!-- Avatar on the first bubble of someone else's group  -->
                            <span x-show="!isMine(m)" class="grid h-7 w-7 shrink-0 place-items-center rounded-full text-xs font-bold"
                                  :class="startsGroup(i) ? 'bg-brand-100 text-brand-700' : 'invisible'" x-text="initial(m.senderName)" aria-hidden="true"></span>

                            <div class="max-w-[78%]" :class="isMine(m) ? 'items-end' : 'items-start'">
                                <p x-show="startsGroup(i) && !isMine(m)" class="mb-0.5 ml-1 text-xs font-semibold text-slate-500" x-text="m.senderName"></p>
                                <div class="rounded-2xl px-3.5 py-2 text-sm whitespace-pre-wrap break-words shadow-sm"
                                     :class="isMine(m) ? 'rounded-br-md bg-brand-500 text-white' : 'rounded-bl-md bg-white text-slate-800'"
                                     x-text="m.text"></div>
                                <p class="mt-0.5 px-1 text-[10px] text-slate-400" :class="isMine(m) ? 'text-right' : ''"
                                   x-text="m.pending ? 'Sending…' : relativeTime(m.createdAt)"></p>
                            </div>
                        </div>
                    </li>
                </template>
            </ol>
        </div>

        <!-- Composer  -->
        <form @submit.prevent="send()" class="border-t border-slate-200 bg-white px-3 pt-2.5 pb-[max(0.625rem,env(safe-area-inset-bottom))]">
            <p x-show="error" x-text="error" x-cloak role="alert" class="mb-2 rounded-xl bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700"></p>
            <div class="flex items-end gap-2">
                <label for="chat-input" class="sr-only">Message</label>
                <textarea id="chat-input" x-ref="input" x-model="draft" rows="1" :maxlength="MAX_LENGTH"
                          @keydown.enter="onEnter($event)" @input="autosize()"
                          placeholder="Message the group…"
                          class="max-h-32 min-h-11 flex-1 resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-base leading-snug focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-500/15 focus:outline-none sm:text-sm"></textarea>
                <button type="submit" :disabled="!canSend" aria-label="Send"
                        class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-brand-500 text-white shadow-lift transition hover:bg-brand-600 disabled:bg-slate-300 disabled:shadow-none">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                </button>
            </div>
            <p class="mt-1 flex justify-between px-1 text-[10px] text-slate-400">
                <span class="max-sm:hidden">Enter to send · Shift+Enter for a new line</span>
                <span x-show="remaining < 100" x-cloak :class="remaining < 0 ? 'text-rose-500' : ''" x-text="remaining + ' left'"></span>
            </p>
        </form>
    </section>
</div>
