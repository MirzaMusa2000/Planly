<!-- Propose event: dark sheet (bottom sheet on mobile, dialog on desktop).  -->
<div x-data="proposeModal" x-show="open" x-cloak class="fixed inset-0 z-[60]" @keydown.escape.window="open && !$store.overlays.chat && !$store.overlays.dialog && close()">
    <div class="absolute inset-0 bg-ink-950/60 backdrop-blur-sm" x-show="open" x-transition.opacity @click="close()"></div>

    <div x-show="open" x-trap.noscroll.inert="open"
         x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-8 opacity-0 sm:translate-y-2"
         x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="translate-y-8 opacity-0 sm:translate-y-2"
         role="dialog" aria-modal="true" aria-labelledby="propose-title"
         class="on-ink absolute inset-x-0 bottom-0 flex max-h-[94dvh] flex-col rounded-t-3xl bg-ink-900 text-white shadow-2xl sm:inset-x-auto sm:top-1/2 sm:bottom-auto sm:left-1/2 sm:w-full sm:max-w-lg sm:-translate-x-1/2 sm:-translate-y-1/2 sm:rounded-3xl">

        <div class="flex items-center gap-3 border-b border-white/10 px-5 py-4">
            <button data-t-attr="aria-label" type="button" @click="close()" class="grid h-9 w-9 place-items-center rounded-xl text-slate-300 hover:bg-white/10" aria-label="Close">
                <x-icon name="x"/>
            </button>
            <h2 id="propose-title" class="text-lg font-bold" data-t>Propose event</h2>
        </div>

        <form @submit.prevent="submit" class="flex min-h-0 flex-1 flex-col" novalidate>
            <div class="flex-1 space-y-5 overflow-y-auto px-5 py-5">
                <div>
                    <label for="propose-title-input" class="label text-slate-200"><span data-t>Title</span> <span class="text-rose-400">*</span></label>
                    <input data-t-attr="placeholder" id="propose-title-input" type="text" x-model="title" :maxlength="LIMITS.title" required
                           placeholder="Beach day, dinner, road trip…" class="input-dark">
                </div>

                <div>
                    <label for="propose-location" class="label text-slate-200" data-t>Location</label>
                    <div class="relative">
                        <x-icon name="map-pin" class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-500"/>
                        <input data-t-attr="placeholder" id="propose-location" type="text" x-model="location" :maxlength="LIMITS.location"
                               placeholder="Where?" class="input-dark pl-11">
                    </div>
                </div>

                <!-- Date options: single days or ranges  -->
                <fieldset>
                    <legend class="label text-slate-200">
                        <span data-t>Date options</span> <span class="text-rose-400">*</span>
                    </legend>

                    <div class="rounded-2xl border border-ink-700 bg-ink-800 p-3">
                        <div data-t-attr="aria-label" class="mb-3 grid grid-cols-2 gap-1 rounded-xl bg-ink-900 p-1" role="radiogroup" aria-label="Each option is">
                            <button type="button" role="radio" @click="setMode('day')" :aria-checked="mode === 'day'"
                                    :class="mode === 'day' ? 'bg-ink-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
                                    class="flex items-center justify-center gap-1.5 rounded-lg py-2 text-xs font-semibold transition">
                                <x-icon name="calendar" class="h-3.5 w-3.5"/> <span data-t>One day</span>
                            </button>
                            <button type="button" role="radio" @click="setMode('range')" :aria-checked="mode === 'range'"
                                    :class="mode === 'range' ? 'bg-ink-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
                                    class="flex items-center justify-center gap-1.5 rounded-lg py-2 text-xs font-semibold transition">
                                <x-icon name="calendar-range" class="h-3.5 w-3.5"/> <span data-t>Several days</span>
                            </button>
                        </div>
                        <p class="mb-3 px-1 text-xs text-slate-400" x-text="hint" aria-live="polite"></p>

                        <div class="mb-2 flex items-center justify-between">
                            <button data-t-attr="aria-label" type="button" @click="shiftMonth(-1)" :disabled="!canGoBack"
                                    class="grid h-8 w-8 place-items-center rounded-lg text-slate-300 hover:bg-white/10 disabled:opacity-30" aria-label="Previous month">
                                <x-icon name="chevron-left" class="h-4 w-4"/>
                            </button>
                            <p class="text-sm font-semibold" x-text="monthLabel" aria-live="polite"></p>
                            <button data-t-attr="aria-label" type="button" @click="shiftMonth(1)"
                                    class="grid h-8 w-8 place-items-center rounded-lg text-slate-300 hover:bg-white/10" aria-label="Next month">
                                <x-icon name="chevron-right" class="h-4 w-4"/>
                            </button>
                        </div>

                        <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-500">
                            <span class="py-1" data-t>Sun</span>
                            <span class="py-1" data-t>Mon</span>
                            <span class="py-1" data-t>Tue</span>
                            <span class="py-1" data-t>Wed</span>
                            <span class="py-1" data-t>Thu</span>
                            <span class="py-1" data-t>Fri</span>
                            <span class="py-1" data-t>Sat</span>
                        </div>

                        <!-- No column gap, so ranges join up into one band -->
                        <div class="grid grid-cols-7 gap-y-1" @mouseleave="hover = null">
                            <template x-for="(date, i) in days" :key="cursor.year + '-' + cursor.month + '-' + i">
                                <div class="h-10">
                                    <button type="button" x-show="date" @click="tap(date)" @mouseenter="hover = date"
                                            :disabled="!!date && isPast(date)"
                                            :aria-pressed="!!date && !!optionAt(date)"
                                            :aria-label="date ? cellLabel(date) : ''"
                                            :class="date ? cellClass(date) : ''"
                                            class="h-full w-full text-sm transition-colors duration-150"
                                            x-text="date ? dayNumber(date) : ''"></button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Chosen options -->
                    <ul data-t-attr="aria-label" class="mt-3 flex flex-wrap gap-2" x-show="options.length" x-cloak aria-label="Chosen date options">
                        <template x-for="option in options" :key="option.start">
                            <li x-transition:enter="transition duration-150 ease-out" x-transition:enter-start="scale-90 opacity-0"
                                class="inline-flex items-center gap-1.5 rounded-full bg-brand-500/15 py-1 pr-1 pl-3 text-xs font-semibold text-brand-200">
                                <span x-text="optionLabel(option)"></span>
                                <span x-show="optionDays(option) > 1" class="rounded-full bg-brand-500/25 px-1.5 py-0.5 text-[10px] text-brand-100"
                                      x-text="$t('{n} days', { n: optionDays(option) })"></span>
                                <button type="button" @click="remove(option)" class="grid h-5 w-5 place-items-center rounded-full hover:bg-white/10"
                                        :aria-label="$t('Remove {date}', { date: optionLabel(option) })">
                                    <x-icon name="x" class="h-3 w-3"/>
                                </button>
                            </li>
                        </template>
                    </ul>
                </fieldset>

                <div>
                    <label for="propose-description" class="label text-slate-200"><span data-t>Description</span> <span class="font-normal text-slate-400" data-t>(optional)</span></label>
                    <textarea data-t-attr="placeholder" id="propose-description" x-model="description" rows="3" :maxlength="LIMITS.description"
                              placeholder="Add details, costs, what to bring…" class="input-dark resize-none"></textarea>
                </div>
            </div>

            <div class="border-t border-white/10 px-5 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
                <p x-show="error" x-text="error" x-cloak role="alert" class="mb-3 rounded-2xl bg-rose-500/15 px-4 py-2.5 text-sm font-medium text-rose-200"></p>
                <button type="submit" :disabled="busy" class="btn btn-primary w-full py-3">
                    <x-icon name="check" class="h-4 w-4"/>
                    <span x-text="submitLabel">Propose event</span>
                </button>
            </div>
        </form>
    </div>
</div>
