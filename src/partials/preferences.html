<!-- Appearance (system / light / dark) and language (English / Bahasa Melayu),
     both kept on this device; the language is also saved to your profile so
     notifications arrive in it (js/ui.js, js/i18n.js). -->
<div class="space-y-3">
    <div>
        <p class="mb-1.5 text-xs font-semibold text-slate-500" data-t>Appearance</p>
        <div class="grid grid-cols-3 gap-1 rounded-2xl bg-slate-100 p-1" role="radiogroup" data-t-attr="aria-label" aria-label="Appearance">
            <template x-for="option in [{ id: 'system', label: $t('System'), icon: 'auto' }, { id: 'light', label: $t('Light'), icon: 'sun' }, { id: 'dark', label: $t('Dark'), icon: 'moon' }]" :key="option.id">
                <button type="button" role="radio" @click="$store.theme.set(option.id)" :aria-checked="$store.theme.choice === option.id"
                        :class="$store.theme.choice === option.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                        class="flex items-center justify-center gap-1.5 rounded-xl py-2 text-xs font-semibold transition">
                    <x-icon name="sun" x-show="option.icon === 'sun'" class="h-3.5 w-3.5"/>
                    <x-icon name="moon" x-show="option.icon === 'moon'" class="h-3.5 w-3.5"/>
                    <x-icon name="auto" x-show="option.icon === 'auto'" class="h-3.5 w-3.5"/>
                    <span x-text="option.label"></span>
                </button>
            </template>
        </div>
    </div>
    <div>
        <p class="mb-1.5 text-xs font-semibold text-slate-500" data-t>Language</p>
        <div class="grid grid-cols-2 gap-1 rounded-2xl bg-slate-100 p-1" role="radiogroup" data-t-attr="aria-label" aria-label="Language">
            <template x-for="option in $store.i18n.languages" :key="option.id">
                <button type="button" role="radio" @click="$store.i18n.set(option.id)" :aria-checked="$store.i18n.lang === option.id"
                        :class="$store.i18n.lang === option.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                        class="rounded-xl py-2 text-xs font-semibold transition" x-text="option.label"></button>
            </template>
        </div>
    </div>
</div>
