<!-- Add / edit a checklist item. Used inside x-if templates (single root). -->
<form data-checklist-form @submit.prevent="saveListItem()" @keydown.escape.stop="closeListForm()"
      class="space-y-3 rounded-2xl border border-slate-200 bg-slate-50 p-3" novalidate>
    <label class="block">
        <span class="mb-1 block text-xs font-semibold text-slate-600">Item</span>
        <input type="text" x-model="listForm.item" :maxlength="CHECKLIST_LIMITS.item" required placeholder="Arang, air mineral, kerusi…" class="input px-3 py-2">
    </label>
    <div class="grid grid-cols-[6rem_minmax(0,1fr)] gap-2">
        <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-600">Qty</span>
            <input type="text" x-model="listForm.quantity" :maxlength="CHECKLIST_LIMITS.quantity" placeholder="2" class="input px-3 py-2">
        </label>
        <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-600">PIC <span class="font-normal text-slate-400">(who brings it)</span></span>
            <select x-model="listForm.picUid" class="input px-3 py-2">
                <option value="">No one yet</option>
                <template x-for="m in sortedMembers" :key="m.uid">
                    <option :value="m.uid" x-text="m.displayName" :selected="m.uid === listForm.picUid"></option>
                </template>
            </select>
        </label>
    </div>
    <label class="block">
        <span class="mb-1 block text-xs font-semibold text-slate-600">Notes <span class="font-normal text-slate-400">(optional)</span></span>
        <input type="text" x-model="listForm.notes" :maxlength="CHECKLIST_LIMITS.notes" placeholder="Brand, size, where to buy…" class="input px-3 py-2">
    </label>

    <p x-show="listError" x-text="listError" role="alert" class="rounded-xl bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700"></p>

    <div class="flex gap-2">
        <button type="submit" :disabled="listBusy" class="btn btn-primary flex-1 py-2">
            <span x-text="listBusy ? 'Saving…' : (listForm.id ? 'Save changes' : 'Add')"></span>
        </button>
        <button type="button" @click="closeListForm()" class="btn btn-secondary py-2" x-text="listForm.id ? 'Cancel' : 'Done'"></button>
        <button type="button" x-show="listForm.id" @click="removeListItem()" class="btn btn-danger py-2" aria-label="Delete item">Delete</button>
    </div>
</form>
