<!-- Add / edit an expense. Used inside x-if templates (single root). -->
<form data-expense-form @submit.prevent="save()" @keydown.escape.stop="closeForm()"
      class="space-y-3 rounded-2xl border border-slate-200 bg-slate-50 p-3" novalidate>
    <label class="block">
        <span class="mb-1 block text-xs font-semibold text-slate-600">Item</span>
        <input type="text" x-model="form.item" :maxlength="EXPENSE_LIMITS.item" required placeholder="Sewa glamping, barang dapur…" class="input px-3 py-2">
    </label>

    <div class="grid grid-cols-2 gap-2">
        <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-600">Amount</span>
            <span class="relative block">
                <span class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-sm font-semibold text-slate-400">RM</span>
                <input type="text" inputmode="decimal" x-model="form.amount" required placeholder="0.00" class="input py-2 pr-3 pl-11">
            </span>
        </label>
        <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-600">Paid by</span>
            <select x-model="form.paidBy" class="input px-3 py-2">
                <template x-for="m in members" :key="m.uid">
                    <option :value="m.uid" x-text="m.uid === me.uid ? m.displayName + ' (you)' : m.displayName" :selected="m.uid === form.paidBy"></option>
                </template>
            </select>
        </label>
    </div>

    <fieldset>
        <div class="mb-1.5 flex items-center justify-between">
            <legend class="text-xs font-semibold text-slate-600">Split between</legend>
            <button type="button" @click="splitEveryone()" class="text-xs font-semibold text-emerald-600 hover:text-emerald-500"
                    x-text="allSplit ? 'Clear' : 'Everyone'"></button>
        </div>
        <div class="flex flex-wrap gap-1.5">
            <template x-for="m in members" :key="m.uid">
                <button type="button" @click="toggleSplit(m.uid)" :aria-pressed="isSplit(m.uid)"
                        :class="isSplit(m.uid) ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-200 bg-white text-slate-600 hover:border-emerald-300'"
                        class="inline-flex items-center gap-1 rounded-full border px-3 py-1 text-xs font-semibold transition">
                    <x-icon name="check" x-show="isSplit(m.uid)" class="h-3 w-3"/>
                    <span x-text="m.displayName"></span>
                </button>
            </template>
        </div>
        <p x-show="formEach" class="mt-1.5 text-xs font-semibold text-emerald-700" x-text="formEach"></p>
    </fieldset>

    <label class="block">
        <span class="mb-1 block text-xs font-semibold text-slate-600">Notes <span class="font-normal text-slate-400">(optional)</span></span>
        <input type="text" x-model="form.notes" :maxlength="EXPENSE_LIMITS.notes" placeholder="Receipt with Mirza, paid by card…" class="input px-3 py-2">
    </label>

    <p x-show="formError" x-text="formError" role="alert" class="rounded-xl bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700"></p>

    <div class="flex gap-2">
        <button type="submit" :disabled="formBusy" class="btn btn-primary flex-1 py-2">
            <span x-text="formBusy ? 'Saving…' : (form.id ? 'Save changes' : 'Add')"></span>
        </button>
        <button type="button" @click="closeForm()" class="btn btn-secondary py-2" x-text="form.id ? 'Cancel' : 'Done'"></button>
        <button type="button" x-show="form.id" @click="remove()" class="btn btn-danger py-2">Delete</button>
    </div>
</form>
