<!-- layout: guest | title: Waiting for approval | page: pending | access: pending -->
    <div class="card overflow-hidden">
        <div class="relative h-44">
            <include src="partials/hero-art.html" class="absolute inset-0 h-full w-full"></include>
            <div class="relative flex h-full flex-col justify-between p-6 text-white">
                <div class="flex items-center gap-2.5">
                    <include src="partials/logo.html" size="h-8 w-8" id="guest"></include>
                    <span class="text-lg font-bold tracking-tight">Planly</span>
                </div>
                <div>
                    <p class="text-sm font-medium text-white/80" x-data><span data-t>Hi</span> <span x-text="$store.session.pending?.displayName || $t('there')"></span> 👋</p>
                    <h1 class="text-2xl font-bold tracking-tight" data-t>Almost there</h1>
                </div>
            </div>
        </div>

        <div class="p-6 sm:p-8">
   <div x-data="pendingPage" class="text-center">

        <template x-if="status === 'pending'">
            <div>
                <div class="mx-auto grid h-16 w-16 place-items-center rounded-3xl bg-amber-50 text-3xl" aria-hidden="true">⏳</div>
                <h2 class="mt-4 text-xl font-bold text-slate-900" data-t>Waiting for admin approval</h2>
                <p class="mt-2 text-sm text-slate-500" x-text="$t('An admin needs to approve {email}. This page updates by itself once you’re in.', { email })"></p>
                <p class="mt-4 inline-flex items-center gap-2 rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">
                    <span class="h-2 w-2 animate-pulse rounded-full bg-amber-500"></span>
                    <span data-t>Waiting for approval</span>
                </p>
            </div>
        </template>

        <template x-if="status === 'rejected'">
            <div>
                <div class="mx-auto grid h-16 w-16 place-items-center rounded-3xl bg-rose-50 text-3xl" aria-hidden="true">🚫</div>
                <h2 class="mt-4 text-xl font-bold text-slate-900" data-t>Access denied</h2>
                <p class="mt-2 text-sm text-slate-500" x-text="$t('The admin hasn’t given {email} access. If you think this is a mistake, ask them directly.', { email })"></p>
            </div>
        </template>

        <template x-if="status === 'approved'">
            <div>
                <div class="mx-auto grid h-16 w-16 place-items-center rounded-3xl bg-emerald-50 text-3xl" aria-hidden="true">🎉</div>
                <h2 class="mt-4 text-xl font-bold text-slate-900" data-t>You're approved!</h2>
                <p class="mt-2 text-sm text-slate-500" data-t>Taking you to your calendar…</p>
            </div>
        </template>

        <p x-show="message" x-text="message" x-cloak class="mt-4 rounded-2xl bg-slate-100 px-4 py-3 text-sm text-slate-600"></p>

        <p x-show="!signedIn" x-cloak class="mt-4 rounded-2xl bg-amber-50 px-4 py-3 text-sm text-amber-800">
            <span data-t>You're signed out in this browser.</span> <a href="/login" class="font-semibold underline" data-t>Sign in again</a> <span data-t>to check your status.</span>
        </p>

        <div class="mt-6 grid gap-2">
            <button type="button" x-show="status === 'pending' && signedIn" @click="check" :disabled="checking" class="btn btn-primary w-full py-3">
                <x-icon name="refresh" class="h-4 w-4"/>
                <span x-text="checking ? $t('Checking…') : $t('Check again')">Check again</span>
            </button>
            <button type="button" @click="$store.session.logout()" class="btn btn-secondary w-full py-3" data-t>Sign out</button>
        </div>
    </div>

        </div>
    </div>
